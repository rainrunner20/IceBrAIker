name: API contract tests

on:
  pull_request:
    paths:
      - "flask-backend/app.py"
      - "flask-backend/validation.py"
      - "flask-backend/tests/**"
      - "flask-backend/requirements-api-test.txt"
      - ".github/workflows/api-contract.yml"
  push:
    branches: [main]
    paths:
      - "flask-backend/app.py"
      - "flask-backend/validation.py"
      - "flask-backend/tests/**"
      - "flask-backend/requirements-api-test.txt"
      - ".github/workflows/api-contract.yml"

jobs:
  api-contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r flask-backend/requirements-api-test.txt
      - name: Test API responses without network or LLM keys
        working-directory: flask-backend
        run: python -m unittest discover -s tests -v
